ktor {
    deployment {
        port = 8080
        port = ${?PORT}
        host = "0.0.0.0"
        host = ${?HOST}
    }
    application {
        modules = [ com.vibes.quantum.server.ApplicationKt.module ]
    }
}

# Server-only configuration. Never copy the admin/provider secrets into Android or browser code.
vibes.gateway {
    adminKey = ""
    adminKey = ${?VIBES_GATEWAY_KEY}

    # Emergency admin-key rotation: both keys are accepted during a staged rollout.
    adminKeyPrevious = ""
    adminKeyPrevious = ${?VIBES_GATEWAY_KEY_PREVIOUS}

    # Durable shared auth/security state. All instances must use the same persistent POSIX volume.
    authSecurityFile = "data/vibes-auth-security.json"
    authSecurityFile = ${?VIBES_AUTH_SECURITY_FILE}
    jwtSigningKeyFile = "data/vibes-jwt-signing.key"
    jwtSigningKeyFile = ${?VIBES_JWT_SIGNING_KEY_FILE}

    registryFile = "data/vibes-apps.json"
    registryFile = ${?VIBES_REGISTRY_FILE}
    apiKeysFile = "data/vibes-api-keys.json"
    apiKeysFile = ${?VIBES_API_KEYS_FILE}

    # Comma-separated IPs of reverse proxies whose X-Forwarded-For header may be trusted for rate limiting.
    trustedProxies = ""
    trustedProxies = ${?VIBES_TRUSTED_PROXIES}

    googleClientId = ""
    googleClientId = ${?GOOGLE_CLIENT_ID}

    upstreamBaseUrl = "https://api.openai.com/v1"
    upstreamBaseUrl = ${?VIBES_UPSTREAM_BASE_URL}
    upstreamApiKey = ""
    upstreamApiKey = ${?VIBES_UPSTREAM_API_KEY}
    upstreamModel = "unconfigured"
    upstreamModel = ${?VIBES_UPSTREAM_MODEL}
    allowedModels = ""
    allowedModels = ${?VIBES_ALLOWED_MODELS}
}


# Phase 6 — source connectors are opt-in and run manually only. Provider keys remain server-side.
vibes.gateway.sourceConnectorsEnabled = "false"
vibes.gateway.sourceConnectorsEnabled = ${?VIBES_SOURCE_CONNECTORS_ENABLED}

vibes.gateway.sourceBraveApiKey = ""
vibes.gateway.sourceBraveApiKey = ${?VIBES_BRAVE_SEARCH_API_KEY}
vibes.gateway.sourceYouTubeApiKey = ""
vibes.gateway.sourceYouTubeApiKey = ${?VIBES_YOUTUBE_API_KEY}

vibes.gateway.sourceStoreFile = "data/vibes-source-learning.json"
vibes.gateway.sourceStoreFile = ${?VIBES_SOURCE_STORE_FILE}
vibes.gateway.sourceMaxRequestsPerRun = "8"
vibes.gateway.sourceMaxRequestsPerRun = ${?VIBES_SOURCE_MAX_REQUESTS_PER_RUN}
vibes.gateway.sourceMaxBytesPerRun = "524288"
vibes.gateway.sourceMaxBytesPerRun = ${?VIBES_SOURCE_MAX_BYTES_PER_RUN}
vibes.gateway.sourceMaxCandidatesPerRun = "15"
vibes.gateway.sourceMaxCandidatesPerRun = ${?VIBES_SOURCE_MAX_CANDIDATES_PER_RUN}

vibes.gateway.sourceRedditClientId = ""
vibes.gateway.sourceRedditClientId = ${?VIBES_REDDIT_CLIENT_ID}
vibes.gateway.sourceRedditClientSecret = ""
vibes.gateway.sourceRedditClientSecret = ${?VIBES_REDDIT_CLIENT_SECRET}


# Phase 7 — reviewed claims and synthetic practice questions; evaluation holdouts remain separate.
vibes.gateway.curriculumStoreFile = "data/vibes-curriculum.json"
vibes.gateway.curriculumStoreFile = ${?VIBES_CURRICULUM_STORE_FILE}
vibes.gateway.learningStoreFile = "data/vibes-learning.json"
vibes.gateway.learningStoreFile = ${?VIBES_LEARNING_STORE_FILE}

# Opaque end-to-end encrypted user vault. The server stores ciphertext but has no client keys.
vibes.gateway.encryptedVaultFile = "data/vibes-encrypted-vault.json"
vibes.gateway.encryptedVaultFile = ${?VIBES_ENCRYPTED_VAULT_FILE}
vibes.gateway.userAppRegistryFile = "data/vibes-user-apps.json"
vibes.gateway.userAppRegistryFile = ${?VIBES_USER_APP_REGISTRY_FILE}

# Operations: persistent file-backed backups and append-only structured security audit.
vibes.gateway.dataDirectory = "data"
vibes.gateway.dataDirectory = ${?VIBES_DATA_DIRECTORY}
vibes.gateway.backupDirectory = "backups"
vibes.gateway.backupDirectory = ${?VIBES_BACKUP_DIRECTORY}
vibes.gateway.backupRestoreTestIntervalDays = "7"
vibes.gateway.backupRestoreTestIntervalDays = ${?VIBES_BACKUP_RESTORE_TEST_INTERVAL_DAYS}
vibes.gateway.securityAuditFile = "data/security-audit.jsonl"
vibes.gateway.securityAuditFile = ${?VIBES_SECURITY_AUDIT_FILE}


# Server-owned training worker proxy. Disabled by default; never put these values in an APK.
vibes.gateway.trainingWorkerEnabled = "false"
vibes.gateway.trainingWorkerEnabled = ${?VIBES_TRAINING_ENABLED}
vibes.gateway.trainingWorkerUrl = ""
vibes.gateway.trainingWorkerUrl = ${?VIBES_TRAINING_WORKER_URL}
vibes.gateway.trainingWorkerApiKey = ""
vibes.gateway.trainingWorkerApiKey = ${?VIBES_TRAINING_WORKER_API_KEY}
vibes.gateway.trainingArtifactAllowedHosts = ""
vibes.gateway.trainingArtifactAllowedHosts = ${?VIBES_TRAINING_ARTIFACT_ALLOWED_HOSTS}
vibes.gateway.trainingJobsFile = "data/vibes-training-jobs.json"
vibes.gateway.trainingJobsFile = ${?VIBES_TRAINING_JOBS_FILE}
